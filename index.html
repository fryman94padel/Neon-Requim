<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#100b27"><title>NEON REQUIEM v0.4.1 — Street Cred & Contracts</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080716;color:#fff;font-family:system-ui,Arial;touch-action:none}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}#overlay{position:fixed;inset:0;background:linear-gradient(140deg,#0a0924ed,#290c3aee);display:flex;align-items:center;justify-content:center;z-index:5;padding:20px}#panel{max-width:440px;width:100%;border:2px solid #17f5ec;background:#100b28;padding:20px;box-shadow:0 0 35px #ec24ac55;text-align:center}h1{color:#ff4abf;text-shadow:3px 3px #16f9ed;letter-spacing:3px;margin:4px 0 6px;font-size:clamp(26px,6vw,42px)}h2{color:#17f5ec;margin:8px 0}p{color:#c4badc;font-size:14px;line-height:1.45}input{background:#08091a;border:1px solid #17f5ec;color:#fff;padding:12px;width:100%;font-size:16px;margin:6px 0}button{background:#ff3bac;border:0;color:#130a23;font-weight:900;letter-spacing:1px;padding:13px 20px;cursor:pointer;min-height:44px}button:active{filter:brightness(1.3)}.colors{display:flex;justify-content:center;gap:12px;margin:12px}.swatch{width:36px;height:36px;border:3px solid transparent;padding:0}.swatch.selected{border-color:white;box-shadow:0 0 12px white}#hud{position:fixed;top:env(safe-area-inset-top);left:0;right:0;pointer-events:none;padding:10px 13px;display:none;z-index:2;font-size:12px;text-shadow:1px 2px #000}#topline{display:flex;justify-content:space-between;gap:10px}#hpbg{width:125px;height:12px;background:#49162f;border:1px solid #ff66b9;margin-top:5px}#hpbar{width:100%;height:100%;background:#ff4c9e}#status{color:#17f5ec;font-weight:bold;text-align:right;max-width:55%}#dash{position:fixed;right:14px;top:calc(44px + env(safe-area-inset-top));bo (()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel'),hud=document.getElementById('hud'),dashButton=document.getElementById('dash'),weaponButton=document.getElementById('weapon'),hint=document.getElementById('hint'),rotate=document.getElementById('rotate');let mercName='NIGHT IMP',weapon=0,flash=0,footsteps=0, W=0,H=0,scale=1,ox=0,oy=0,playing=false,ended=false,last=0,now=0,shake=0,chosen='#1af2e6',player,enemies=[],bullets=[],particles=[],shard,exit,keys={},mouse={x:0,y:0,down:false},sticks={left:null,right:null},camera={x:0,y:0};const WEAPONS=[{name:'PISTOL',cool:.19,damage:25,speed:530,spread:0},{name:'SMG',cool:.085,damage:11,speed:590,spread:.095}];const WORLD={w:1200,h:740},TAU=Math.PI*2;const walls=[{x:240,y:135,w:110,h:75},{x:550,y:80,w:100,h:120},{x:825,y:160,w:120,h:75},{x:345,y:365,w:120,h:80},{x:675,y:395,w:105,h:105},{x:980,y:430,w:115,h:70},{x:130,y:510,w:100,h:90}];const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);const circleRect=(x,y,r,b)=>{let qx=clamp(x,b.x,b.x+b.w),qy=clamp(y,b.y,b.y+b.h);return (x-qx)**2+(y-qy)**2<r*r};function resize(){W=innerWidth;H=innerHeight;const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*d);canvas.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);rotate.classList.toggle('active',playing&&matchMedia('(orientation: portrait) and (pointer: coarse)').matches)}addEventListener('resize',resize);resize();const HAIRS=['Crop','Swept','Spiky','Long'],HAIR_COLORS=['#a855f7','#ff42b7','#1af2e6','#e5e9ff','#202538','#ffb44c'],SKIN_COLORS=['#f5c7a7','#d89c77','#b77753','#89563d','#59372d'],OUTFITS=['Jacket','Vest','Coat'],OUTFIT_COLORS=['#ff42b7','#1af2e6','#a855f7','#f7d451','#9eaac7'];let look={hair:1,hairColor:0,skin:1,outfit:0,outfitColor:1};try{const saved=JSON.parse(localStorage.getItem('neonRequiemLookV03')||'null');if(saved)for(const k of Object.keys(look))if(Number.isInteger(saved[k]))look[k]=saved[k]}catch(e){}const SAVEKEY='neonRequiemProgressV04';const MISSIONS=[{name:'Dead Drop',desc:'Eliminate 3 hostiles, recover the stolen shard, then extract.',reward:150,xp:100},{name:'Ghost Signal',desc:'Disable three signal relays and extract. Avoid guards or fight through.',reward:200,xp:150},{name:'No Witnesses',desc:'Survive three waves of enemies, including a heavy enforcer, then extract.',reward:250,xp:200}];const UPGRADES=[{name:'Reinforced Plating',desc:'+20 maximum HP',cost:150},{name:'Weapon Calibration',desc:'+10% weapon damage',cost:200},{name:'Reflex Booster',desc:'Dash cooldown reduced to 1.7 seconds',cost:250}];let progress={credits:0,xp:0,completed:[false,false,false],upgrades:[false,false,false],callsign:'NIGHT IMP'};try{let v=JSON.parse(localStorage.getItem(SAVEKEY)||'null');if(v&&typeof v==='object'){progress.credits=Math.max(0,Number(v.credits)||0);progress.xp=Math.max(0,Number(v.xp)||0);if(Array.isArray(v.completed))progress.completed=v.completed.slice(0,3).map(Boolean);if(Array.isArray(v.upgrades))progress.upgrades=v.upgrades.slice(0,3).map(Boolean);if(typeof v.callsign==='string')progress.callsign=v.callsign.slice(0,18)}}catch(e){}while(progress.completed.length<3)progress.completed.push(false);while(progress.upgrades.length<3)progress.upgrades.push(false);mercName=progress.callsign;let mission=0,relays=[],wave=0,waveWait=0,damageFlash=0;const escapeHTML=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function saveProgress(){try{localStorage.setItem(SAVEKEY,JSON.stringify(progress));localStorage.setItem('neonRequiemLookV03',JSON.stringify(look))}catch(e){}}function level(){return 1+Math.floor(progress.xp/250)}function hub(){playing=false;overlay.style.display='flex';hud.style.display='none';dashButton.style.display='none';weaponButton.style.display='none';hint.style.display='none';rotate.classList.remove('active');panel.innerHTML=`<h1>NEON REQUIEM</h1><div class="hubhead">NIGHTFALL CITY // MERCENARY SAFEHOUSE</div><p>Welcome back, <strong>${escapeHTML(progress.callsign)}</strong>. The city never sleeps. Neither do the contracts.</p><div class="wallet">€$ ${progress.credits} &nbsp;·&nbsp; STREET CRED LV ${level()} &nbsp;·&nbsp; ${progress.xp} XP</div><div class="hub-actions"><button id="contracts">CONTRACTS</button><button id="shop" class="secondary">UPGRADES</button><button id="appearance" class="secondary">APPEARANCE</button></div><p class="small">${progress.completed.filter(Boolean).length}/3 contracts completed · Rewards repeatable · XP first clear only</p>`;document.getElementById('contracts').onclick=showContracts;document.getElementById('shop').onclick=showShop;document.getElementById('appearance').onclick=showCreator}function showContracts(){panel.innerHTML='<h2>CONTRACT TERMINAL</h2><p class="small">Select a job. Complete its objective and return to extraction.</p>'+MISSIONS.map((m,i)=>`<div class="mission"><b>00${i+1} // ${m.name}</b> ${progress.completed[i]?'✓ CLEARED':''}<p>${m.desc}</p><div class="small">€$ ${m.reward} per clear · ${m.xp} XP on first clear</div><button data-contract="${i}">DEPLOY ▶</button></div>`).join('')+'<button id="back" class="secondary compact">← SAFEHOUSE</button>';panel.querySelectorAll('[data-contract]').forEach(b=>b.onclick=()=>reset(Number(b.dataset.contract)));document.getElementById('back').onclick=hub}function showShop(){panel.innerHTML=`<h2>CHROME CLINIC</h2><p class="wallet">AVAILABLE: €$ ${progress.credits}</p>`+UPGRADES.map((u,i)=>`<div class="shoprow"><span><b>${u.name}</b><br><span class="small">${u.desc}</span></span><button data-upgrade="${i}" ${progress.upgrades[i]||progress.credits<u.cost?'disabled':''}>${progress.upgrades[i]?'OWNED':'€$ '+u.cost}</button></div>`).join('')+'<p class="small">Upgrades are permanent and affect all contracts.</p><button id="back" class="secondary compact">← SAFEHOUSE</button>';panel.querySelectorAll('[data-upgrade]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.upgrade);if(!progress.upgrades[i]&&progress.credits>=UPGRADES[i].cost){progress.credits-=UPGRADES[i].cost;progress.upgrades[i]=true;saveProgress();showShop()}});document.getElementById('back').onclick=hub}function showCreator(){panel.innerHTML=`<h2>MERCENARY CREATOR</h2><input id="name" maxlength="18" placeholder="Mercenary callsign" aria-label="Mercenary callsign" value="${escapeHTML(progress.callsign)}"><div id="creator"><canvas id="preview" width="112" height="152" aria-label="Live appearance preview"></canvas><div id="custom"><div class="creator-row"><span class="creator-label">HAIR STYLE</span><div id="hairStyles" class="options"></div></div><div class="creator-row"><span class="creator-label">HAIR COLOUR</span><div id="hairColors" class="options"></div></div><div class="creator-row"><span class="creator-label">SKIN TONE</span><div id="skinColors" class="options"></div></div><div class="creator-row"><span class="creator-label">OUTFIT</span><div id="outfits" class="options"></div></div><div class="creator-row"><span class="creator-label">OUTFIT COLOUR</span><div id="outfitColors" class="options"></div></div></div></div><p class="small">Cosmetic only · Saved automatically</p><div class="hub-actions"><button id="saveLook">SAVE & RETURN</button><button id="creatorBack" class="secondary">← BACK TO SAFEHOUSE</button></div>`;for(const [id,key,values] of [['hairStyles','hair',HAIRS],['hairColors','hairColor',HAIR_COLORS],['skinColors','skin',SKIN_COLORS],['outfits','outfit',OUTFITS],['outfitColors','outfitColor',OUTFIT_COLORS]]){const root=document.getElementById(id);values.forEach((value,i)=>{const b=document.createElement('button');b.type='button';b.className=(key==='hairColor'||key==='skin'||key==='outfitColor')?'tone':'choice';b.textContent=b.className==='choice'?value:'';b.title=value;b.setAttribute('aria-label',key+' '+value);if(b.className==='tone')b.style.background=value;b.onclick=()=>{look[key]=i;refreshCreator()};root.appendChild(b)})}const returnFromCreator=()=>{progress.callsign=document.getElementById('name').value.trim().slice(0,18)||'MERC';mercName=progress.callsign;saveProgress();hub()};document.getElementById('saveLook').onclick=returnFromCreator;document.getElementById('creatorBack').onclick=returnFromCreator;refreshCreator()}function refreshCreator(){for(const [id,key] of [['hairStyles','hair'],['hairColors','hairColor'],['skinColors','skin'],['outfits','outfit'],['outfitColors','outfitColor']])document.querySelectorAll('#'+id+' button').forEach((b,i)=>{b.classList.toggle('selected',look[key]===i);b.setAttribute('aria-pressed',String(look[key]===i))});chosen=OUTFIT_COLORS[look.outfitColor];saveProgress();drawPreview()}function drawPreview(){const c=document.getElementById('preview');if(!c)return;const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.fillStyle='#0a1024';g.fillRect(0,0,112,152);for(let i=0;i<112;i+=16){g.fillStyle='#17213b';g.fillRect(i,0,1,152)}for(let i=0;i<152;i+=16){g.fillStyle='#17213b';g.fillRect(0,i,112,1)}g.save();g.translate(56,76);g.scale(2.4,2.4);drawMerc(g,0,0,look,0,0,false,0);g.restore();g.fillStyle='#17f5ec';g.font='8px monospace';g.textAlign='center';g.fillText('LIVE PREVIEW',56,144)}hub();function spawnEnemy(x,y,heavy=false){const r=heavy?17:13;let sx=x,sy=y;if(collides(sx,sy,r)){let found=false;search:for(let radius=12;radius<=300;radius+=12){for(let k=0;k<48;k++){const a=k*Math.PI*2/48,nx=x+Math.cos(a)*radius,ny=y+Math.sin(a)*radius;if(!collides(nx,ny,r+2)&&Math.hypot(nx-player.x,ny-player.y)>65){sx=nx;sy=ny;found=true;break search}}}if(!found){sx=90;sy=340}}return{x:sx,y:sy,hp:heavy?170:65,maxHp:heavy?170:65,cool:1+Math.random(),r,heavy,walk:0,angle:0}}function reset(which=mission){mission=which;weapon=0;flash=0;footsteps=0;now=0;shake=0;wave=0;waveWait=0;const maxHp=100+(progress.upgrades[0]?20:0);player={x:90,y:340,r:13,hp:maxHp,maxHp,angle:0,cool:0,dash:0,dashCD:0,invuln:0,color:chosen,kills:0,credits:0};enemies=mission===
